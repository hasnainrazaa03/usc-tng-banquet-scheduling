name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          # Build is DB-free (every route is force-dynamic) but Next still
          # validates env. Provide dummies so the build succeeds without
          # exposing real secrets.
          AUTH_SECRET: ci-dummy-secret-please-rotate
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
